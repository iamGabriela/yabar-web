<!DOCTYPE html>
<html lang="es">
<head>
<script>(function(){try{var t=localStorage.getItem('yabar_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carga masiva | Yabar</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=3">
<link rel="icon" type="image/x-icon" href="images/brand/favicon.ico">
<style>
  body{background:var(--crema);padding:40px 0 80px;}
  .wrap{max-width:700px;margin:0 auto;padding:0 20px;}
  .box{background:#fff;border:1px solid var(--piedra);border-radius:16px;padding:28px;margin-bottom:24px;}
  .box h2{font-family:var(--font-display);font-size:1.2rem;margin-bottom:14px;}
  .field{margin-bottom:14px;display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:.8rem;font-weight:700;color:var(--marron-2);}
  .field input{padding:10px 12px;border:1px solid var(--piedra);border-radius:8px;font-family:var(--font-body);font-size:.95rem;}
  #log{font-family:monospace;font-size:.82rem;background:#111;color:#0f0;padding:16px;border-radius:8px;max-height:400px;overflow-y:auto;white-space:pre-wrap;}
  .item{padding:4px 0;}
  .item.ok{color:#7CFC7C;}
  .item.err{color:#ff7c7c;}
</style>
</head>
<body>
<div class="wrap">

  <div class="box">
    <h2>Carga masiva de productos — Yabar</h2>
    <p style="color:#9a8f80;font-size:.85rem;margin-bottom:16px;">
      Esto crea automáticamente los productos usando las imágenes ya subidas a <code>images/productos/</code>.
      Los precios son de referencia — edítalos después en el <a href="/admin.html">panel admin</a>.
    </p>
    <div class="field">
      <label for="login-user">Usuario admin</label>
      <input type="text" id="login-user" autocomplete="username">
    </div>
    <div class="field">
      <label for="login-pass">Contraseña</label>
      <input type="password" id="login-pass" autocomplete="current-password">
    </div>
    <button class="btn btn--primary" id="btn-cargar" style="width:100%;justify-content:center;">
      Cargar los 20 productos
    </button>
  </div>

  <div class="box">
    <h2>Resultado</h2>
    <div id="log">Esperando...</div>
  </div>

</div>

<script>
const API_URL = "https://yabar-web.onrender.com/api";
const BASE_IMG = "https://yabar-web.vercel.app/images/productos/";

// Lista de productos generada a partir de tus imagenes ya subidas.
// Edita nombre / categoria / precio / unidad como prefieras antes de cargar.
const productos = [
  { nombre: "Barra de Construcción 1/2\" x 9m", categoria: "Fierro de construcción", precio: 45, unidad: "la unidad", imagen: "barra-de-construccion-1-2-x9m-aceros-arequipa.jpg" },
  { nombre: "Barra de Construcción 12mm x 9m", categoria: "Fierro de construcción", precio: 42, unidad: "la unidad", imagen: "barra-de-construccion-12mm-x9m-aceros-arequipa.jpg" },
  { nombre: "Barra de Construcción 1\" x 9m", categoria: "Fierro de construcción", precio: 68, unidad: "la unidad", imagen: "barra-de-construccion-1x9m-aceros-arequipa.jpg" },
  { nombre: "Barra de Construcción 3/4\" x 9m", categoria: "Fierro de construcción", precio: 58, unidad: "la unidad", imagen: "barra-de-construccion-3-4-x9m-aceros-arequipa.jpg" },
  { nombre: "Barra de Construcción 3/8\" x 9m", categoria: "Fierro de construcción", precio: 22, unidad: "la unidad", imagen: "barra-de-construccion-3-8-x9m-aceros-arequipa.jpg" },
  { nombre: "Barra de Construcción 4.7mm x 9m", categoria: "Fierro de construcción", precio: 15, unidad: "la unidad", imagen: "barra-de-construccion-4.7mm-x-9m-aceros-arequipa.jpg" },
  { nombre: "Barra de Construcción 5/8\" x 9m", categoria: "Fierro de construcción", precio: 52, unidad: "la unidad", imagen: "barra-de-construccion-5-8-x9m-aceros-arequipa.jpg" },
  { nombre: "Barra de Construcción 6mm x 9m", categoria: "Fierro de construcción", precio: 18, unidad: "la unidad", imagen: "barra-de-construccion-6mm-x9m-aceros-arequipa.jpg" },
  { nombre: "Barra de Construcción 8mm x 9m", categoria: "Fierro de construcción", precio: 28, unidad: "la unidad", imagen: "barra-de-construccion-8mm-x9m-aceros-arequipa.jpg" },
  { nombre: "Ladrillo Hueco 12 Liso Lark", categoria: "Ladrillos", precio: 1.1, unidad: "la unidad", imagen: "ladrillo-hueco-12-liso-lark.png" },
  { nombre: "Ladrillo Hueco 15 Acanalado Lark", categoria: "Ladrillos", precio: 1.3, unidad: "la unidad", imagen: "ladrillo-hueco-15-acanalado-lark.png" },
  { nombre: "Ladrillo Hueco 20 Liso Lark", categoria: "Ladrillos", precio: 1.6, unidad: "la unidad", imagen: "ladrillo-hueco-20-liso-lark.jpg" },
  { nombre: "Ladrillo Hueco 8 Liso Lark", categoria: "Ladrillos", precio: 0.9, unidad: "la unidad", imagen: "ladrillo-hueco-8-liso-lark.png" },
  { nombre: "Ladrillo King Kong 18 Huecos Lark", categoria: "Ladrillos", precio: 1.2, unidad: "la unidad", imagen: "ladrillo-king-kong-18-huecos-lark.png" },
  { nombre: "Ladrillo Pandereta Lark", categoria: "Ladrillos", precio: 0.8, unidad: "la unidad", imagen: "ladrillo-pandereta-lark.png" },
  { nombre: "Ladrillo Pastelero Lark", categoria: "Ladrillos", precio: 0.7, unidad: "la unidad", imagen: "ladrillo-pastelero-lark.png" },
  { nombre: "Tubo 1/2\" x5m C-10 Pavco", categoria: "Tuberías", precio: 12, unidad: "la unidad", imagen: "tubo-1-2-x5m-c10-pavco.webp" },
  { nombre: "Tubo 1\" x5m C-10 Pavco", categoria: "Tuberías", precio: 16, unidad: "la unidad", imagen: "tubo-1-x5m-c10-pavco.webp" },
  { nombre: "Tubo 1 1/2\" x5m C-10 Pavco", categoria: "Tuberías", precio: 22, unidad: "la unidad", imagen: "tubo-1.1-2-x5m-c10-pavco.webp" },
  { nombre: "Tubo 2\" x5m C-10 Pavco", categoria: "Tuberías", precio: 28, unidad: "la unidad", imagen: "tubo-2-x5m-c10-pavco.webp" },
];

const logEl = document.getElementById('log');
function log(msg, cls) {
  const div = document.createElement('div');
  div.className = 'item ' + (cls || '');
  div.textContent = msg;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

document.getElementById('btn-cargar').addEventListener('click', async () => {
  logEl.innerHTML = '';
  const username = document.getElementById('login-user').value.trim();
  const password = document.getElementById('login-pass').value;

  log('Iniciando sesión...');
  let token;
  try {
    const res = await fetch(`${API_URL}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    if (!res.ok) throw new Error('login fallido');
    const data = await res.json();
    token = data.token;
    log('Sesión iniciada correctamente.', 'ok');
  } catch (e) {
    log('ERROR: usuario o contraseña incorrectos.', 'err');
    return;
  }

  for (const p of productos) {
    try {
      const body = {
        nombre: p.nombre,
        categoria: p.categoria,
        precio: p.precio,
        unidad: p.unidad,
        descripcion: '',
        imagenUrl: BASE_IMG + p.imagen,
        activo: true
      };
      const res = await fetch(`${API_URL}/productos/admin`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify(body)
      });
      if (res.ok) {
        log(`✓ Creado: ${p.nombre}`, 'ok');
      } else {
        log(`✗ Falló: ${p.nombre}`, 'err');
      }
    } catch (e) {
      log(`✗ Error de red en: ${p.nombre}`, 'err');
    }
  }

  log('Proceso terminado. Revisa el panel admin.', 'ok');
});
</script>
</body>
</html>
