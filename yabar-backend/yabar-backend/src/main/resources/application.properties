spring.application.name=yabar-backend

# Base de datos: valores vienen de variables de entorno en Railway, nunca hardcodeados
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=28800000

# CORS: dominio real de tu landing en Vercel (cambialo por el tuyo)
app.frontend-origin=${FRONTEND_ORIGIN}

# Usuario admin inicial (solo se usa una vez, al arrancar, si no existe ningun usuario)
admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}

server.port=${PORT:8080}
