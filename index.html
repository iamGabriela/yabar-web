<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Productos | Ferretería Yabar</title>
<meta name="description" content="Catálogo completo de materiales de construcción, maquinaria y herramientas en Ferretería Yabar. Sedes Nasca y Acarí.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
  <div class="container header__inner">
    <button class="mobile-menu-toggle" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>
    <a href="index.html" class="logo">
      <span class="logo__mark">Y</span>YABAR<span class="logo__dot">.</span>
    </a>
    <nav class="nav">
      <a href="#servicios">Servicios</a>
      <a href="#productos" class="active">Productos</a>
      <a href="#confianza">Nosotros</a>
    </nav>
    <div class="header__cta">
      <a class="btn btn--wa" target="_blank" rel="noopener"
         href="https://wa.me/51958345849?text=Hola%20Yabar%2C%20quisiera%20informaci%C3%B3n">
        <span class="wa-icon"></span> Escríbenos
      </a>
    </div>
  </div>
</header>

<div class="app-layout">
  <!-- SIDEBAR DE FILTROS -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__content">
      <div class="filter-group">
        <label class="filter-label">Búsqueda</label>
        <div class="search-input-wrapper">
          <input type="text" id="searchInput" placeholder="Buscar producto..." class="form-input">
        </div>
      </div>

      <div class="filter-group">
        <label class="filter-label">Categoría</label>
        <select id="categoryFilter" class="form-select">
          <option value="all">Todas las categorías</option>
          <option value="barras">Barras de construcción</option>
          <option value="ladrillos">Ladrillos</option>
          <option value="pvc-luz">Tubos PVC Luz</option>
          <option value="pvc-c10">Tubos PVC Presión C10</option>
          <option value="cpvc">Tubos CPVC</option>
          <option value="desague">Tubos Desagüe</option>
        </select>
      </div>

      <div class="filter-group">
        <label class="filter-label">Marca</label>
        <select id="brandFilter" class="form-select">
          <option value="all">Todas las marcas</option>
          <option value="aceros-arequipa">Aceros Arequipa</option>
          <option value="piramide">Pirámide</option>
          <option value="pavco">Pavco</option>
          <option value="nicoll">Nicoll</option>
        </select>
      </div>

      <div class="filter-group">
        <label class="filter-label">Sede</label>
        <select id="branchFilter" class="form-select">
          <option value="all">Todas las sedes</option>
          <option value="nasca">Nasca</option>
          <option value="acari">Acarí</option>
          <option value="ambas">Ambas</option>
        </select>
      </div>

      <div class="filter-group">
        <label class="filter-label">Ordenar por</label>
        <select id="sortFilter" class="form-select">
          <option value="name-asc">Nombre (A-Z)</option>
          <option value="price-asc">Precio (Menor a Mayor)</option>
          <option value="price-desc">Precio (Mayor a Menor)</option>
          <option value="stock-desc">Stock (Mayor a Menor)</option>
        </select>
      </div>
    </div>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-content">
    <div class="content-header">
      <div class="content-header__info">
        <h1 class="page-title">Catálogo de Productos</h1>
        <p class="results-count" id="resultsCount">Cargando productos...</p>
      </div>
      <div class="view-switcher">
        <button class="view-btn active" id="gridViewBtn" title="Vista Cuadrícula">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        </button>
        <button class="view-btn" id="tableViewBtn" title="Vista Tabla">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        </button>
      </div>
    </div>

    <!-- CONTENEDOR DE PRODUCTOS -->
    <div id="catalogContainer" class="grid-view">
      <!-- Los productos se cargarán dinámicamente aquí -->
    </div>
  </main>
</div>

<footer class="footer">
  <div class="container">
    <div class="footer__inner">
      <div>
        <p class="logo logo--footer"><span class="logo__mark">Y</span>YABAR<span class="logo__dot">.</span></p>
        <p class="footer__addr">
          <strong>Sede Nasca:</strong> Av. Bolognesi #123<br>
          <strong>Sede Acarí:</strong> Calle Comercio #456
        </p>
      </div>
      <div class="footer__contact">
        <a href="tel:+51958345849">+51 958 345 849</a>
        <a href="mailto:contacto@yabar.com">contacto@yabar.com</a>
      </div>
    </div>
    <div class="footer__bottom">
      &copy; 2026 Ferretería Yabar. Todos los derechos reservados.
    </div>
  </div>
</footer>

   target="_blank" rel="noopener" class="whatsapp-float" aria-label="Escribir por WhatsApp">

<script src="script.js"></script>
</body>
</html>
