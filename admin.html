<!DOCTYPE html>
<html lang="es">
<head>
<script>(function(){try{var t=localStorage.getItem('yabar_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin | Yabar</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=17">
<link rel="icon" type="image/x-icon" href="images/brand/favicon.ico">
<style>
  body{background:var(--crema);padding:40px 0 80px;}
  .admin-wrap{max-width:900px;margin:0 auto;padding:0 20px;}
  .admin-box{background:#fff;border:1px solid var(--piedra);border-radius:16px;padding:28px;margin-bottom:24px;}
  .admin-box h2{font-family:var(--font-display);font-size:1.3rem;margin-bottom:18px;}
  .field{margin-bottom:14px;display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:.8rem;font-weight:700;color:var(--marron-2);}
  .field input, .field textarea{
    padding:10px 12px;border:1px solid var(--piedra);border-radius:8px;font-family:var(--font-body);font-size:.95rem;
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .table{width:100%;border-collapse:collapse;font-size:.9rem;}
  .table th, .table td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--piedra);}
  .table button{border:none;background:none;cursor:pointer;font-weight:700;padding:4px 8px;border-radius:6px;}
  .table button.edit{color:var(--marron-2);}
  .table button.del{color:#c0392b;}
  #login-box{max-width:380px;margin:60px auto;}
  #error-msg{color:#c0392b;font-size:.85rem;margin-top:8px;display:none;}
  #app{display:none;}

  .upload-zone{
    border:2px dashed var(--piedra);border-radius:12px;padding:20px;text-align:center;
    cursor:pointer;transition:border-color .15s ease,background .15s ease;
  }
  .upload-zone:hover, .upload-zone.is-dragover{border-color:var(--naranja);background:rgba(255,90,31,.04);}
  .upload-zone__text{font-size:.85rem;color:var(--marron-2);font-weight:600;}
  .upload-zone__hint{font-size:.75rem;color:#9a8f80;margin-top:2px;}
  .upload-preview{display:none;align-items:center;gap:14px;margin-top:10px;}
  .upload-preview.is-visible{display:flex;}
  .upload-preview img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--piedra);}
  .upload-preview__info{font-size:.82rem;color:var(--marron-2);}
  .upload-preview__remove{color:#c0392b;font-weight:700;font-size:.8rem;border:none;background:none;cursor:pointer;padding:0;}
  .upload-status{font-size:.82rem;margin-top:8px;display:none;}
  .upload-status.is-visible{display:block;}
  .upload-status.loading{color:var(--marron-2);}
  .upload-status.error{color:#c0392b;}
  .upload-manual-toggle{font-size:.78rem;color:#9a8f80;text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;margin-top:6px;}
  #campo-imagen-manual{display:none;margin-top:8px;}
  #campo-imagen-manual.is-visible{display:block;}
</style>
</head>
<body>

<div class="admin-wrap">

  <div id="login-box" class="admin-box">
    <h2>Panel Yabar — Ingreso</h2>
    <div class="field">
      <label for="login-user">Usuario</label>
      <input type="text" id="login-user" autocomplete="username">
    </div>
    <div class="field">
      <label for="login-pass">Contraseña</label>
      <input type="password" id="login-pass" autocomplete="current-password">
    </div>
    <button class="btn btn--primary" id="btn-login" style="width:100%;justify-content:center;">Ingresar</button>
    <p id="error-msg">Usuario o contraseña incorrectos.</p>
  </div>

  <div id="app">
    <div class="admin-box" style="display:flex;justify-content:space-between;align-items:center;">
      <h2 style="margin:0;">Productos de Yabar</h2>
      <button class="btn btn--ghost" id="btn-logout">Cerrar sesión</button>
    </div>

    <div class="admin-box">
      <h2 id="form-title">Nuevo producto</h2>
      <input type="hidden" id="prod-id">
      <div class="row2">
        <div class="field"><label for="prod-nombre">Nombre</label><input type="text" id="prod-nombre"></div>
        <div class="field"><label for="prod-categoria">Categoría</label><input type="text" id="prod-categoria"></div>
      </div>
      <div class="row2">
        <div class="field"><label for="prod-precio">Precio (S/)</label><input type="number" step="0.01" id="prod-precio"></div>
        <div class="field"><label for="prod-unidad">Unidad (ej: "el millar", "el día")</label><input type="text" id="prod-unidad"></div>
      </div>
      <div class="field"><label for="prod-descripcion">Descripción</label><textarea id="prod-descripcion" rows="2"></textarea></div>
      <div class="field"><label for="prod-imagen-input">Foto del producto</label>
        <div class="upload-zone" id="upload-zone">
          <p class="upload-zone__text">Toca para elegir una foto, o arrástrala aquí</p>
          <p class="upload-zone__hint">JPG, PNG o WEBP — máx. 5MB</p>
          <input type="file" id="prod-imagen-file" accept="image/*" style="display:none;">
        </div>
        <div class="upload-preview" id="upload-preview">
          <img id="upload-preview-img" src="" alt="Vista previa">
          <div class="upload-preview__info">
            <div id="upload-preview-name"></div>
            <button type="button" class="upload-preview__remove" id="btn-quitar-imagen">Quitar foto</button>
          </div>
        </div>
        <p class="upload-status" id="upload-status"></p>
        <button type="button" class="upload-manual-toggle" id="btn-imagen-manual">o pega el link de una imagen ya subida</button>
        <div id="campo-imagen-manual">
          <input type="text" id="prod-imagen" placeholder="https://...">
        </div>
      </div>
      <div style="display:flex;gap:12px;margin-top:10px;">
        <button class="btn btn--primary" id="btn-guardar">Guardar</button>
        <button class="btn btn--ghost" id="btn-cancelar" style="display:none;">Cancelar edición</button>
      </div>
    </div>

    <div class="admin-box">
      <h2>Listado (<span id="contador">0</span>/20)</h2>
      <table class="table">
        <thead><tr><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Activo</th><th></th></tr></thead>
        <tbody id="tabla-body"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
// Cambia esto por la URL real de tu backend una vez desplegado en Railway
const API_URL = "https://yabar-web.onrender.com/api";

// =========================================================
// SUBIDA DE FOTOS — usa Cloudinary (gratis, sin tocar tu backend).
// Para activarlo:
//   1. Crea una cuenta gratis en https://cloudinary.com
//   2. En Settings → Upload → "Add upload preset", crea uno y
//      ponlo en modo "Unsigned" (sin firma). Guarda ese nombre.
//   3. Reemplaza los dos valores de abajo con los tuyos.
// Mientras no los configures, puedes seguir usando "pega el link"
// para cargar fotos manualmente.
// =========================================================
const CLOUDINARY_CLOUD_NAME = "TU_CLOUD_NAME";
const CLOUDINARY_UPLOAD_PRESET = "TU_UPLOAD_PRESET";

let token = localStorage.getItem("yabar_token") || null;

const loginBox = document.getElementById("login-box");
const app = document.getElementById("app");

function mostrarApp() {
  loginBox.style.display = "none";
  app.style.display = "block";
  cargarProductos();
}

if (token) mostrarApp();

document.getElementById("btn-login").addEventListener("click", async () => {
  const username = document.getElementById("login-user").value.trim();
  const password = document.getElementById("login-pass").value;
  const errorMsg = document.getElementById("error-msg");
  errorMsg.style.display = "none";

  try {
    const res = await fetch(`${API_URL}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    if (!res.ok) throw new Error("credenciales invalidas");
    const data = await res.json();
    token = data.token;
    localStorage.setItem("yabar_token", token);
    mostrarApp();
  } catch (e) {
    errorMsg.style.display = "block";
  }
});

document.getElementById("btn-logout").addEventListener("click", () => {
  localStorage.removeItem("yabar_token");
  token = null;
  app.style.display = "none";
  loginBox.style.display = "block";
});

async function cargarProductos() {
  const res = await fetch(`${API_URL}/productos/admin/todos`, {
    headers: { "Authorization": `Bearer ${token}` }
  });
  if (res.status === 401) { document.getElementById("btn-logout").click(); return; }
  const productos = await res.json();

  const tbody = document.getElementById("tabla-body");
  tbody.innerHTML = "";
  document.getElementById("contador").textContent = productos.length;

  productos.forEach(p => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${p.nombre}</td>
      <td>${p.categoria || "-"}</td>
      <td>S/ ${p.precio}</td>
      <td>${p.activo ? "Sí" : "No"}</td>
      <td>
        <button class="edit" data-id="${p.id}">Editar</button>
        <button class="del" data-id="${p.id}">Eliminar</button>
      </td>`;
    tbody.appendChild(tr);
    tr.querySelector(".edit").addEventListener("click", () => cargarEnFormulario(p));
    tr.querySelector(".del").addEventListener("click", () => eliminarProducto(p.id));
  });
}

function cargarEnFormulario(p) {
  document.getElementById("form-title").textContent = "Editando producto";
  document.getElementById("prod-id").value = p.id;
  document.getElementById("prod-nombre").value = p.nombre;
  document.getElementById("prod-categoria").value = p.categoria || "";
  document.getElementById("prod-precio").value = p.precio;
  document.getElementById("prod-unidad").value = p.unidad || "";
  document.getElementById("prod-descripcion").value = p.descripcion || "";
  document.getElementById("prod-imagen").value = p.imagenUrl || "";
  mostrarPreviewImagen(p.imagenUrl || "", "Foto actual del producto");
  document.getElementById("btn-cancelar").style.display = "inline-flex";
}

function limpiarFormulario() {
  document.getElementById("form-title").textContent = "Nuevo producto";
  document.getElementById("prod-id").value = "";
  ["nombre","categoria","precio","unidad","descripcion","imagen"].forEach(campo => {
    document.getElementById(`prod-${campo}`).value = "";
  });
  ocultarPreviewImagen();
  document.getElementById("btn-cancelar").style.display = "none";
}

document.getElementById("btn-cancelar").addEventListener("click", limpiarFormulario);

// =========================================================
// SUBIDA DE FOTOS
// =========================================================
const uploadZone = document.getElementById("upload-zone");
const inputArchivo = document.getElementById("prod-imagen-file");
const uploadStatus = document.getElementById("upload-status");
const campoImagenManual = document.getElementById("campo-imagen-manual");

function mostrarPreviewImagen(url, nombre) {
  const preview = document.getElementById("upload-preview");
  if (!url) { ocultarPreviewImagen(); return; }
  document.getElementById("upload-preview-img").src = url;
  document.getElementById("upload-preview-name").textContent = nombre || "Foto cargada";
  preview.classList.add("is-visible");
}

function ocultarPreviewImagen() {
  document.getElementById("upload-preview").classList.remove("is-visible");
  document.getElementById("upload-preview-img").src = "";
}

function mostrarEstadoSubida(msg, tipo) {
  uploadStatus.textContent = msg;
  uploadStatus.className = "upload-status is-visible" + (tipo ? " " + tipo : "");
}

function limpiarEstadoSubida() {
  uploadStatus.className = "upload-status";
  uploadStatus.textContent = "";
}

uploadZone.addEventListener("click", () => inputArchivo.click());
uploadZone.addEventListener("dragover", (e) => { e.preventDefault(); uploadZone.classList.add("is-dragover"); });
uploadZone.addEventListener("dragleave", () => uploadZone.classList.remove("is-dragover"));
uploadZone.addEventListener("drop", (e) => {
  e.preventDefault();
  uploadZone.classList.remove("is-dragover");
  if (e.dataTransfer.files[0]) subirFoto(e.dataTransfer.files[0]);
});
inputArchivo.addEventListener("change", () => {
  if (inputArchivo.files[0]) subirFoto(inputArchivo.files[0]);
});

document.getElementById("btn-quitar-imagen").addEventListener("click", () => {
  document.getElementById("prod-imagen").value = "";
  ocultarPreviewImagen();
  limpiarEstadoSubida();
  inputArchivo.value = "";
});

document.getElementById("btn-imagen-manual").addEventListener("click", () => {
  campoImagenManual.classList.toggle("is-visible");
});

async function subirFoto(file) {
  limpiarEstadoSubida();

  if (!file.type.startsWith("image/")) {
    mostrarEstadoSubida("Ese archivo no es una imagen.", "error");
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    mostrarEstadoSubida("La foto pesa más de 5MB. Prueba con una más liviana.", "error");
    return;
  }
  if (CLOUDINARY_CLOUD_NAME === "TU_CLOUD_NAME") {
    mostrarEstadoSubida("La subida de fotos aún no está configurada (falta el Cloud Name de Cloudinary). Usa \"pega el link\" por ahora.", "error");
    return;
  }

  mostrarPreviewImagen(URL.createObjectURL(file), file.name);
  mostrarEstadoSubida("Subiendo foto...", "loading");

  try {
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
      method: "POST",
      body: formData
    });
    if (!res.ok) throw new Error("fallo la subida");
    const data = await res.json();

    document.getElementById("prod-imagen").value = data.secure_url;
    mostrarPreviewImagen(data.secure_url, file.name);
    mostrarEstadoSubida("Foto subida ✓", "");
  } catch (e) {
    mostrarEstadoSubida("No se pudo subir la foto. Intenta de nuevo o pega el link manualmente.", "error");
  }
}

document.getElementById("btn-guardar").addEventListener("click", async () => {
  const id = document.getElementById("prod-id").value;
  const body = {
    nombre: document.getElementById("prod-nombre").value.trim(),
    categoria: document.getElementById("prod-categoria").value.trim(),
    precio: parseFloat(document.getElementById("prod-precio").value),
    unidad: document.getElementById("prod-unidad").value.trim(),
    descripcion: document.getElementById("prod-descripcion").value.trim(),
    imagenUrl: document.getElementById("prod-imagen").value.trim(),
    activo: true
  };

  if (!body.nombre || !body.precio) { alert("Nombre y precio son obligatorios."); return; }

  const url = id ? `${API_URL}/productos/admin/${id}` : `${API_URL}/productos/admin`;
  const method = id ? "PUT" : "POST";

  const res = await fetch(url, {
    method,
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
    body: JSON.stringify(body)
  });

  if (res.ok) {
    limpiarFormulario();
    cargarProductos();
  } else {
    alert("No se pudo guardar el producto.");
  }
});

async function eliminarProducto(id) {
  if (!confirm("¿Eliminar este producto?")) return;
  const res = await fetch(`${API_URL}/productos/admin/${id}`, {
    method: "DELETE",
    headers: { "Authorization": `Bearer ${token}` }
  });
  if (res.ok) cargarProductos();
}
</script>
</body>
</html>
